<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>随手记 · 分类笔记与项目记录</title>
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="menuBtn" title="目录">☰</button>
  <div class="brand">📝 随手记</div>
  <span class="sync">
    <span class="dot" id="ghStatusDot"></span><span id="ghStatusText">本地就绪</span>
    <span id="syncAgo"></span>
    <button class="btn ghost sm" data-gh="push" hidden id="syncRetry">重试</button>
  </span>
  <div class="spacer"></div>
  <button class="btn pip-accent sm" id="pipBtn" title="桌面悬浮球：置顶显示最近记录，打开任意文件都能看到（点击拉起）" hidden>◫ 悬浮窗</button>
  <button class="btn ghost sm" id="settingsBtn" title="设置与同步">设置</button>
</header>

<div class="layout">
  <!-- ============ 侧栏 · 总目录 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="side-scroll">
      <div class="side-sec">
        <div class="side-title">快速入口</div>
        <div class="tree-item" data-act="view" data-view="all" id="nav-all">
          <span class="tname">📋 全部记录</span><span class="cnt" id="cnt-all"></span>
        </div>
        <div class="tree-item" data-act="view" data-view="trash" id="nav-trash">
          <span class="tname">🗑 回收站</span><span class="cnt" id="cnt-trash"></span>
        </div>
      </div>

      <div class="side-sec">
        <div class="side-title">分类目录 <button class="mini" data-act="addroot" data-kind="cat" title="新建顶级分类">＋</button></div>
        <div id="catTree"></div>
      </div>

      <div class="side-sec">
        <div class="side-title">项目 <button class="mini" data-act="addroot" data-kind="proj" title="新建顶级项目">＋</button></div>
        <div id="projTree"></div>
      </div>

      <!-- 跨设备同步设置（默认折叠） -->
      <details class="side-sec" id="settingsSec">
        <summary class="side-title">⚙ 跨设备同步</summary>
        <div class="card">
          <div class="muted" style="margin-bottom:10px">每台设备填<strong>同一个</strong> Token，数据自动经你账号下的私有 Gist 同步，不经第三方服务器。</div>
          <div class="field">
            <label for="ghToken">GitHub Token（只勾 gist）</label>
            <input id="ghToken" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_… 或 github_pat_…">
          </div>
          <div class="row">
            <button class="btn dark sm" data-gh="push">上传</button>
            <button class="btn ghost sm" data-gh="pull">拉取</button>
            <button class="btn ghost sm" data-gh="test">验证</button>
            <button class="btn ghost sm" data-gh="diag">自检</button>
            <button class="btn ghost sm" data-gh="unify">统一</button>
          </div>
          <div id="ghBox" style="margin-top:10px"></div>
          <label class="chk" style="margin-top:8px"><input id="ghAuto" type="checkbox"> 自动同步</label>
          <details style="margin-top:10px">
            <summary class="muted" style="cursor:pointer;font-size:12px">高级：Gist ID / 同步码</summary>
            <div class="field" style="margin-top:8px">
              <input id="ghGist" type="text" autocomplete="off" spellcheck="false" placeholder="Gist ID（留空自动查找）">
            </div>
            <div class="field">
              <input id="ghCode" type="text" autocomplete="off" spellcheck="false" placeholder="同步码 / 同步链接，粘贴后回车">
            </div>
            <div class="row">
              <button class="btn dark sm" data-gh="copyCode">复制同步码</button>
              <button class="btn ghost sm" data-gh="copyLink">复制同步链接</button>
              <button class="btn ghost sm" data-gh="importCode">接入</button>
              <button class="btn ghost sm" data-gh="forget">忘记此设备</button>
            </div>
          </details>
          <div class="muted" style="margin-top:8px">
            <a href="https://github.com/settings/tokens/new?scopes=gist" target="_blank" rel="noopener">生成 Token</a>（勾选 <code>gist</code>）。
          </div>
        </div>
        <div class="muted" style="font-size:11px;margin-top:8px;line-height:1.6">
          关联规则：同分类 / 同项目 / 有共同标签的记录自动互相关联；无需手动维护。
        </div>
      </details>
    </div>
  </aside>
  <div class="mask" id="mask"></div>

  <!-- ============ 主区 ============ -->
  <main class="main">
    <div id="roBanner" class="ro-banner" hidden>
      只读分享视图 · 共 <b id="roCount">0</b> 条，由对方通过分享链接发送。
      <button class="linkbtn" data-act="exitro">关闭</button>
    </div>

    <div id="editor">
      <textarea id="noteText" placeholder="随手记点什么…（支持多行）" rows="2"></textarea>
      <div class="composer-row picker-row">
        <span class="mv-item">📂 <select id="inCat"></select></span>
        <button class="mini" id="inCatAdd" title="新建分类（重名自动选用已有）">＋新建</button>
        <span class="mv-item">📌 <select id="inProj"></select></span>
        <button class="mini" id="inProjAdd" title="新建项目（重名自动选用已有）">＋新建</button>
        <span class="mv-item">🔖 <select id="inTodo" title="待办标记（可不选）">
          <option value="">无</option>
          <option value="todo">待办</option>
          <option value="done">已完成</option>
        </select></span>
      </div>
      <div class="composer-row">
        <button class="btn ghost sm" id="imgBtn" title="添加图片（也可在输入框直接粘贴截图）">📷</button>
        <input type="file" id="imgPick" accept="image/*" multiple hidden>
        <input id="noteTags" type="text" placeholder="标签（空格分隔，可不填）">
        <button class="btn dark" id="addBtn">＋ 保存记录</button>
      </div>
      <div id="pendImgs" class="pendimgs"></div>
    </div>

    <div class="toolbar">
      <input id="searchBox" type="search" placeholder="🔍 检索内容 / 标签 / 分类 / 项目…">
      <button class="btn ghost sm" id="expXlsBtn" title="导出为 Excel 表格（.xlsx）">导出 Excel</button>
      <button class="btn ghost sm" id="expJsonBtn">导出 JSON</button>
      <button class="btn ghost sm" id="shareBtn" title="把当前筛选结果生成只读链接给他人">分享链接</button>
    </div>

    <div class="crumb" id="crumb"></div>
    <div id="listBox"></div>
  </main>
</div>

<div id="toast"></div>

<!-- ============ 分享弹窗 ============ -->
<div class="modal-mask" id="shareMask" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <span>🔗 分享只读链接</span>
      <button class="modal-x" data-act="closeshare" aria-label="关闭">×</button>
    </div>
    <div class="share-meta" id="shareMeta"></div>
    <textarea id="shareUrl" readonly spellcheck="false" rows="4" placeholder="分享链接"></textarea>
    <div class="share-warn" id="shareWarn" hidden></div>
    <div class="share-btns">
      <button class="btn dark" id="shareNative" hidden>系统分享</button>
      <button class="btn dark" id="shareCopy">复制链接</button>
      <button class="btn ghost" id="shareOpen">打开预览</button>
      <button class="btn ghost" data-act="closeshare">关闭</button>
    </div>
    <div class="muted share-tip">
      链接本身包含记录内容，不经任何服务器，对方打开即只读浏览。<br>
      手机点「系统分享」可直接发微信/短信；若自动复制被浏览器拦截，<b>长按上面的链接框</b>即可手动复制。
    </div>
  </div>
</div>

<script src="gh-sync.js?v=1"></script>
<script src="export-xlsx.js?v=1"></script>
<script src="app.js?v=14"></script>
</body>
</html>
